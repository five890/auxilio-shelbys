<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Shelbys Auxílio Ultra</title>
<style>
  /* Bloqueia zoom e mantém tema preto estilo Netflix */
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #000;
    color: #fff;
    overflow-x: hidden;
  }

  /* Login */
  #loginBox {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  #loginBox input {
    padding: 10px;
    margin: 5px 0;
    border-radius: 5px;
    border: none;
    outline: none;
  }
  #loginBox button {
    padding: 10px 20px;
    background: #0ff;
    color: #000;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    margin-top: 10px;
  }

  /* Painel */
  #panel.hidden { display: none; }
  #panel {
    padding: 20px;
  }
  .panel-option {
    display: flex;
    align-items: center;
    margin-bottom: 15px;
  }
  .panel-option input {
    margin-right: 10px;
  }
  #activateButton {
    padding: 15px 20px;
    background: #0f0;
    color: #000;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
    width: 100%;
    max-width: 300px;
  }

  /* Aviso */
  #aviso {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 9999;
  }
  .aviso-box {
    background: #111;
    padding: 25px;
    width: 300px;
    text-align: center;
    border-radius: 10px;
    box-shadow: 0 0 20px #0ff;
  }
  .aviso-box a {
    background:#25D366;
    padding:10px 15px;
    color:#fff;
    border-radius:5px;
    text-decoration:none;
    display:inline-block;
    margin-top:10px;
  }

  /* Animação "Injetando" */
  #injecting {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    color: #0ff;
    font-size: 30px;
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 9998;
  }
</style>
</head>
<body>

<!-- AVISO -->
<div id="aviso">
  <div class="aviso-box">
    <p>Se você não comprou na loja oficial da Shelby's, denuncie no WhatsApp abaixo o vendedor.</p>
    <a href="https://wa.me/5515996945451" target="_blank">WhatsApp</a>
  </div>
</div>

<!-- LOGIN -->
<div id="loginBox">
  <h1>Shelbys Auxílio Ultra</h1>
  <input type="text" id="user" placeholder="Usuário">
  <input type="password" id="pass" placeholder="Senha">
  <button onclick="login()">Entrar</button>
</div>

<!-- PAINEL -->
<div id="panel" class="hidden">
  <div class="panel-option"><input type="checkbox" id="fps"> <label for="fps">Otimização de FPS</label></div>
  <div class="panel-option"><input type="checkbox" id="recoil"> <label for="recoil">Anti Recuo</label></div>
  <div class="panel-option"><input type="checkbox" id="firstShot"> <label for="firstShot">Primeiro Tiro Capa</label></div>
  <div class="panel-option"><input type="checkbox" id="blacklist"> <label for="blacklist">Anti Black List</label></div>
  <div class="panel-option"><input type="checkbox" id="ban"> <label for="ban">Anti Ban</label></div>
  <div class="panel-option"><input type="checkbox" id="bypass"> <label for="bypass">Bypass</label></div>
  <button id="activateButton" onclick="activateFF()">Ativar no Free Fire</button>
</div>

<!-- INJETANDO -->
<div id="injecting">Injetando...</div>

<script>
  const USER = "shelby";
  const PASS = "1234";

  function login() {
    const u = document.getElementById("user").value;
    const p = document.getElementById("pass").value;

    if(u === USER && p === PASS){
      // Mostra aviso
      const aviso = document.getElementById("aviso");
      aviso.style.display = "flex";

      setTimeout(() => {
        aviso.style.display = "none";
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("panel").classList.remove("hidden");
      }, 5000);

    } else {
      alert("Login inválido!");
    }
  }

  function activateFF() {
    const injecting = document.getElementById("injecting");
    injecting.style.display = "flex";

    setTimeout(() => {
      injecting.style.display = "none";
      alert("Ativação simulada finalizada!");
    }, 5000);
  }
</script>

</body>
</html>
