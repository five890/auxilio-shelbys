<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel</title>

<style>
body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    width:320px;
    background:#111;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 20px cyan;
}

input{
    width:100%;
    padding:10px;
    margin:8px 0;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:10px;
    cursor:pointer;
}

#panel{
    display:none;
}
</style>
</head>
<body>

<div class="box" id="loginBox">
    <h2>Login</h2>

    <input type="text" id="user" placeholder="Usuário">
    <input type="password" id="pass" placeholder="Senha">

    <button onclick="login()">Entrar</button>
</div>

<div class="box" id="panel">
    <h2>Painel</h2>
    <p>Login realizado com sucesso.</p>

    <label><input type="checkbox"> Opção 1</label><br>
    <label><input type="checkbox"> Opção 2</label><br>
    <label><input type="checkbox"> Opção 3</label>
</div>

<script>
const usuarios = [
    { user: "Gabriel", pass: "Frazao" },
    { user: "Vitor", pass: "2818" },
    { user: "KR", pass: "00" },
    { user: "astrinho7", pass: "050317" },
    { user: "Pedro777", pass: "3112" }
];

function login() {
    const u = document.getElementById("user").value;
    const p = document.getElementById("pass").value;

    const valido = usuarios.find(
        usuario => usuario.user === u && usuario.pass === p
    );

    if (valido) {
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("panel").style.display = "block";
    } else {
        alert("Usuário ou senha inválidos!");
    }
}
</script>

</body>
</html>
