<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shelbys Auxílio Ultra</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: Arial; }

body {
    background:#000;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* LOGIN */
#loginBox {
    background:#111;
    padding:35px;
    border-radius:10px;
    width:300px;
    text-align:center;
    box-shadow:0 0 25px #0ff;
}
#loginBox input {
    width:100%;
    padding:10px;
    margin:8px 0;
    border:none;
    border-radius:5px;
}
#loginBox button {
    width:100%;
    padding:10px;
    background:#0ff;
    border:none;
    cursor:pointer;
    font-weight:bold;
}

/* PAINEL */
#panel {
    background:#111;
    padding:30px;
    border-radius:10px;
    width:400px;
    text-align:center;
    box-shadow:0 0 25px #0ff;
}
#panel.hidden { display:none; }

label {
    display:block;
    margin:10px 0;
}

button {
    margin-top:15px;
    width:100%;
    padding:12px;
    background:#0ff;
    border:none;
    font-weight:bold;
    cursor:pointer;
}

/* AVISO */
#aviso {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.95);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:999;
}
#aviso.hidden { display:none; }

.aviso-box {
    background:#111;
    padding:25px;
    width:300px;
    text-align:center;
    border-radius:10px;
    box-shadow:0 0 20px #0ff;
}

.btn {
    display:inline-block;
    margin-top:15px;
    background:#25D366;
    color:#fff;
    padding:10px 15px;
    text-decoration:none;
    border-radius:5px;
    font-weight:bold;
}

/* INJETANDO */
#inject {
    position:fixed;
    inset:0;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:30px;
    color:#0ff;
    font-weight:bold;
    z-index:9999;
}
#inject.hidden { display:none; }

</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
    <h2>Shelbys Ultra</h2>
    <input id="user" placeholder="Usuário">
    <input id="pass" type="password" placeholder="Senha">
    <button onclick="login()">Entrar</button>
</div>

<!-- AVISO -->
<div id="aviso" class="hidden">
    <div class="aviso-box">
        <p>Se você não comprou na loja oficial da Shelby's, denuncie no WhatsApp abaixo o vendedor.</p>
        <a class="btn" href="https://wa.me/5515996945451" target="_blank">WhatsApp</a>
    </div>
</div>

<!-- PAINEL -->
<div id="panel" class="hidden">
    <h2>Painel</h2>

    <label><input type="checkbox"> Otimização FPS</label>
    <label><input type="checkbox"> Anti Recuo</label>
    <label><input type="checkbox"> Primeiro Tiro Capa</label>
    <label><input type="checkbox"> Anti Blacklist</label>
    <label><input type="checkbox"> Anti Ban</label>
    <label><input type="checkbox"> Bypass</label>

    <button onclick="inject()">Ativar no Free Fire</button>
</div>

<!-- INJETANDO -->
<div id="inject" class="hidden">INJETANDO...</div>

<script>

const USER = "shelbys";
const PASS = "1234";

function login() {
    let u = document.getElementById("user").value;
    let p = document.getElementById("pass").value;

    if(u === USER && p === PASS){

        // mostra aviso
        document.getElementById("aviso").classList.remove("hidden");

        setTimeout(() => {
            document.getElementById("aviso").classList.add("hidden");
            document.getElementById("loginBox").style.display = "none";
            document.getElementById("panel").classList.remove("hidden");
        }, 5000);

    } else {
        alert("Login inválido!");
    }
}

function inject() {
    document.getElementById("panel").classList.add("hidden");
    document.getElementById("inject").classList.remove("hidden");

    setTimeout(() => {
        document.getElementById("inject").classList.add("hidden");
        document.getElementById("panel").classList.remove("hidden");
    }, 5000);
}

</script>

</body>
</html>
